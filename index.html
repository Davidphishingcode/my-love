<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505; /* Deep dark background */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        /* 3D Glowing Beating Heart */
        .heart-container {
            position: relative;
            width: 150px;
            height: 150px;
            animation: heartbeat 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
            margin-bottom: 50px;
            filter: drop-shadow(0 0 30px rgba(255, 0, 50, 0.8));
        }

        .heart {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 40px 40px, #ff4d4d, #b30000);
            transform: rotate(-45deg);
            border-radius: 10px 10px 0 0;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.5), inset 10px 10px 20px rgba(255,255,255,0.3);
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle at 40px 40px, #ff4d4d, #b30000);
            border-radius: 50%;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.5);
        }

        .heart::before {
            top: -75px;
            left: 0;
        }

        .heart::after {
            top: 0;
            left: 75px;
        }

        /* Heartbeat Animation */
        @keyframes heartbeat {
            0% { transform: scale(0.95); }
            10% { transform: scale(1.1); }
            20% { transform: scale(0.95); }
            30% { transform: scale(1.1); }
            40% { transform: scale(0.95); }
            100% { transform: scale(0.95); }
        }

        /* 3D Text Styling */
        .text-3d {
            font-size: 3rem;
            font-weight: bold;
            color: #ffffff;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 5px;
            margin: 0;
            opacity: 0;
            animation: fadeInText 3s ease-in forwards;
            animation-delay: 1s;
            text-shadow: 
                0 1px 0 #cccccc,
                0 2px 0 #c9c9c9,
                0 3px 0 #bbb,
                0 4px 0 #b9b9b9,
                0 5px 0 #aaa,
                0 6px 1px rgba(0,0,0,.1),
                0 0 5px rgba(0,0,0,.1),
                0 1px 3px rgba(0,0,0,.3),
                0 3px 5px rgba(0,0,0,.2),
                0 5px 10px rgba(0,0,0,.25),
                0 10px 10px rgba(0,0,0,.2),
                0 20px 20px rgba(255, 0, 50, 0.4);
        }

        /* Quote Styling */
        .quote {
            margin-top: 30px;
            color: #ffb3b3;
            font-size: 1.2rem;
            text-align: center;
            font-style: italic;
            max-width: 80%;
            line-height: 1.5;
            opacity: 0;
            animation: fadeInText 3s ease-in forwards;
            animation-delay: 2.5s;
            text-shadow: 0 0 10px rgba(255, 179, 179, 0.5);
        }

        .quote-am {
            margin-top: 15px;
            color: #fff;
            font-size: 1.1rem;
            opacity: 0;
            animation: fadeInText 3s ease-in forwards;
            animation-delay: 4s;
        }

        @keyframes fadeInText {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Floating particles for extra effect */
        .particle {
            position: absolute;
            background: rgba(255, 0, 50, 0.5);
            border-radius: 50%;
            animation: floatUp 5s infinite linear;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="heart-container">
        <div class="heart"></div>
    </div>

    <h1 class="text-3d">I Love You <br> So Much</h1>
    
    <p class="quote">"In a sea of people, my eyes will always search for you. You are my today and all of my tomorrows."</p>
    <p class="quote quote-am">"አንቺ ማለት ለኔ ከቃላት በላይ ነሽ። የህይወቴ ብርሃን፣ የልቤ ትርታ..."</p>

    <script>
        // Create floating love particles in the background
        function createParticles() {
            const body = document.querySelector('body');
            for(let i = 0; i < 30; i++) {
                let particle = document.createElement('div');
                particle.className = 'particle';
                
                let size = Math.random() * 8 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDuration = (Math.random() * 3 + 2) + 's';
                particle.style.animationDelay = Math.random() * 2 + 's';
                
                body.appendChild(particle);
            }
        }
        createParticles();
    </script>
</body>
</html>
